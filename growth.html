<!DOCTYPE html>
<html lang="zh-TW" data-i18n-title="meta.titleGrowth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《Dino Mutant》成長紀錄(非官方)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 頁面頂部標題 -->
  <div class="app-header">
    <div class="app-title"><span class="admin-trigger" onclick="location.href='/admin'">🦖</span> <span data-i18n="header.growth">《Dino Mutant》成長紀錄(非官方)</span></div>
  </div>

  <!-- 頁面導覽 -->
  <nav class="site-nav">
    <a href="index.html" data-i18n="nav.calculator">🧮 符文計算器</a>
    <a href="guide.html" data-i18n="nav.guide">📖 攻略</a>
    <a href="growth.html" class="active" data-i18n="nav.growth">📈 成長紀錄</a>
    <select id="langSelect" class="lang-select" onchange="setLanguage(this.value)">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="ja">日本語</option>
    </select>
  </nav>

  <div class="main-wrapper">
    <div class="left-column" style="max-width: 900px;">

      <!-- 新增／編輯每日紀錄表單 -->
      <div class="equipped-panel">
        <div class="panel-header"><span data-i18n="growth.formTitle">新增／編輯每日紀錄</span></div>
        <div class="stats-panel" style="box-shadow:none; border:none; padding:0; background:transparent;">
          <div class="stat-input-group">
            <label for="growthDateInput" data-i18n="growth.dateLabel">日期</label>
            <input type="date" id="growthDateInput" class="stat-input">
          </div>
          <div class="stat-input-group">
            <label for="growthAtkInput" data-i18n="growth.atkLabel">最高攻擊</label>
            <input type="number" id="growthAtkInput" class="stat-input" placeholder="0" min="0">
          </div>
          <div class="stat-input-group">
            <label for="growthHpInput" data-i18n="growth.hpLabel">最高血量</label>
            <input type="number" id="growthHpInput" class="stat-input" placeholder="0" min="0">
          </div>
          <div class="stat-input-group">
            <label for="growthSpeedInput" data-i18n="growth.speedLabel">最高速度</label>
            <input type="number" id="growthSpeedInput" class="stat-input" placeholder="0" min="0">
          </div>
        </div>
        <div class="growth-form-actions">
          <button class="action-btn" id="growthFormSubmitBtn" onclick="submitGrowthForm()" data-i18n="growth.addBtn">新增紀錄</button>
          <button class="action-btn" id="growthCancelEditBtn" onclick="cancelEdit()" data-i18n="growth.cancelEditBtn" hidden>取消編輯</button>
        </div>
      </div>

      <!-- 成長趨勢圖 -->
      <div class="equipped-panel">
        <div class="panel-header"><span data-i18n="growth.chartTitle">成長趨勢圖</span></div>

        <div class="growth-range-bar">
          <div class="stat-input-group">
            <label for="growthRangeStart" data-i18n="growth.rangeStart">開始日期</label>
            <input type="date" id="growthRangeStart" class="stat-input" onchange="onDateRangeChanged()">
          </div>
          <div class="stat-input-group">
            <label for="growthRangeEnd" data-i18n="growth.rangeEnd">結束日期</label>
            <input type="date" id="growthRangeEnd" class="stat-input" onchange="onDateRangeChanged()">
          </div>
          <button class="action-btn growth-reset-range-btn" onclick="resetDateRange()" data-i18n="growth.resetRange">重設為預設範圍</button>
        </div>

        <div class="growth-chart-wrap">
          <svg id="growthChartSvg" class="growth-chart-svg"></svg>
          <div id="growthChartEmpty" class="growth-chart-empty" data-i18n="growth.chartEmpty" hidden>此區間內沒有資料</div>
        </div>

        <div class="growth-chart-legend">
          <span><i class="growth-legend-dot" style="background:#76c720"></i><span data-i18n="growth.legendAtk">攻擊</span></span>
          <span><i class="growth-legend-dot" style="background:#00e5ff"></i><span data-i18n="growth.legendHp10">血量／10</span></span>
          <span><i class="growth-legend-dot" style="background:#ffca28"></i><span data-i18n="growth.legendSpeed">速度</span></span>
          <span><i class="growth-legend-dot" style="background:#ff5470"></i><span data-i18n="growth.legendLevel">恐龍等級</span></span>
        </div>
      </div>

      <!-- 每日紀錄列表 -->
      <div class="equipped-panel">
        <div class="panel-header"><span data-i18n="growth.tableTitle">每日紀錄</span></div>
        <div class="guide-table-scroll" style="max-height: 420px;">
          <table class="guide-table">
            <thead>
              <tr>
                <th data-i18n="growth.colDate">日期</th>
                <th data-i18n="growth.colAtk">攻擊</th>
                <th data-i18n="growth.colHp">血量</th>
                <th data-i18n="growth.colSpeed">速度</th>
                <th data-i18n="growth.colLevel">恐龍等級</th>
                <th data-i18n="growth.colCreated">填寫時間</th>
                <th data-i18n="growth.colUpdated">修正時間</th>
                <th data-i18n="growth.colActions">操作</th>
              </tr>
            </thead>
            <tbody id="growthTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- 免責聲明區塊 -->
  <div class="disclaimer-container">
    <div class="disclaimer-title" data-i18n="disclaimer.title">⚠️ 免責聲明與使用須知：</div>
    <div data-i18n="disclaimer.growth.line1">1. 本頁面為《Dino Mutant》玩家個人/社群獨立開發之輔助工具，**純屬交流分享且絕無營利行為**，祝大家遊戲愉快！🎮</div>
    <div data-i18n="disclaimer.growth.line2">2. 所有紀錄僅儲存在你目前使用的瀏覽器裡，換瀏覽器、換裝置或清除瀏覽器資料都會遺失，請自行留意備份。</div>
    <div data-i18n="disclaimer.growth.line3">3. 本頁面與《Dino Mutant》遊戲官方無關，請勿用於任何商業用途。</div>
  </div>

  <script src="i18n.js"></script>
  <script src="growth.js"></script>
</body>
</html>
